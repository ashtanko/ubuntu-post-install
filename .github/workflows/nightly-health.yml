name: nightly-health

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run local regression gate
        run: make check

  current-lts-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run Ubuntu 24.04 smoke suite
        run: bash tests/run-in-docker.sh 24.04 smoke

  report:
    needs: [regressions, current-lts-smoke]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const label = 'nightly-health';
            const results = Object.values(${{ toJSON(needs) }}).map(job => job.result);
            const failed = results.some(result => result !== 'success');
            const counts = results.reduce((outcome, result) => {
              outcome[result] = (outcome[result] || 0) + 1;
              return outcome;
            }, {});
            const countText = Object.entries(counts).map(([key, value]) => `${key}: ${value}`).join(', ');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name: label,
                  color: 'd73a4a',
                  description: 'Tracks nightly project health failures',
                });
              } else {
                throw e;
              }
            }

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });
            const existing = open[0];

            if (failed) {
              const body = `Nightly health run failed on ${today}.\n\nJobs: ${countText}\nRun: ${runUrl}`;
              if (existing) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  ...context.repo,
                  title: `Nightly health check failing (since ${today})`,
                  labels: [label],
                  body,
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `Nightly health recovered on ${today}.\n\nJobs: ${countText}\nRun: ${runUrl}`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
