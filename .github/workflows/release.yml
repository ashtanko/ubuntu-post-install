name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v) — for dry-run only'
        required: true
        default: '0.0.0-dev'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make check

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04', '26.04']
    name: smoke / ubuntu-${{ matrix.ubuntu }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ matrix.ubuntu }}-${{ hashFiles('tests/Dockerfile') }}
          restore-keys: |
            buildx-${{ matrix.ubuntu }}-
      - env:
          DOCKER_BUILD_CACHE_DIR: /tmp/.buildx-cache
        run: bash tests/run-in-docker.sh ${{ matrix.ubuntu }} smoke

  release:
    needs: [lint, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source lib/release.bash
          FIELDS=$(resolve_release_version "$EVENT_NAME" "$DISPATCH_VERSION" "$REF_NAME")
          IFS='|' read -r TAG SEMVER PRERELEASE <<< "$FIELDS"
          echo "tag=$TAG"               >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER"         >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Build terminal UI
        run: make tui-build

      - name: Stage release tree
        env:
          SEMVER: ${{ steps.ver.outputs.semver }}
        run: |
          set -euo pipefail
          STAGE="dist/ubuntu-post-install-${SEMVER}"
          mkdir -p "$STAGE"
          # Copy repo contents excluding VCS, IDE, build, and local config
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.idea/' \
            --exclude='.omx/' \
            --exclude='dist/' \
            --exclude='.env' \
            ./ "$STAGE/"
          # Embed version
          sed -i "s/^VERSION=.*/VERSION=\"${SEMVER}\"/" "$STAGE/setup.sh"
          echo "$SEMVER" > "$STAGE/VERSION"

      - name: Build tarball
        env:
          SEMVER: ${{ steps.ver.outputs.semver }}
        run: |
          set -euo pipefail
          cd dist
          tar -czf "ubuntu-post-install-${SEMVER}.tar.gz" "ubuntu-post-install-${SEMVER}"
          rm -rf "ubuntu-post-install-${SEMVER}"
          cp ../install.sh ./install.sh
          sha256sum "ubuntu-post-install-${SEMVER}.tar.gz" install.sh > SHA256SUMS

      - name: Verify release artifact
        env:
          SEMVER: ${{ steps.ver.outputs.semver }}
        run: bash tests/release-artifact.sh "$SEMVER"

      - name: Upload artifacts (workflow_dispatch dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.semver }}
          path: |
            dist/ubuntu-post-install-${{ steps.ver.outputs.semver }}.tar.gz
            dist/install.sh
            dist/SHA256SUMS

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: |
            dist/ubuntu-post-install-${{ steps.ver.outputs.semver }}.tar.gz
            dist/install.sh
            dist/SHA256SUMS
